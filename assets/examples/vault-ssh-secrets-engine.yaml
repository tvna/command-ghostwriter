ssh_mount: "ssh-client-signer"
role_name: "app-servers"
allowed_users:
  - "ops"
  - "deploy"
ttl: "30m"
max_ttl: "1h"
server_trusted_ca: true

vault:
  addr: "https://vault.internal:8200"

server:
  host: "app-01"
  admin_user: "ops"

paths:
  ca_pub_file: "/etc/ssh/trusted-user-ca-keys.pem"
  sshd_dropin: "/etc/ssh/sshd_config.d/50-trusted-ca.conf"

key:
  label: "id_ed25519_app01"
