    backend_mode: proxy
    owner: ops-taro@example.internal
    reserved_token: 9f3k2a1kx0
  - name: build-artifacts
    target: 127.0.0.1:9000
    share_mode: private
    backend_mode: proxy
    owner: dev-hanako@example.internal
    reserved_token: 7bq1z4xwq2
