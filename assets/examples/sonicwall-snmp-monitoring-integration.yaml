system_name: "sonicwall-tza-edge01"
system_contact: "netops@example.co.jp"
system_location: "大阪データセンター 3F ラックA12"
snmp_interfaces:
  - name: "X0"
    zone: "LAN"
    enable_snmp: true
    reason: "Zabbixサーバがこのセグメントに接続されており、ポーリング応答が必要なため"
  - name: "X1"
    zone: "WAN"
    enable_snmp: false
    reason: "インターネット側にSNMP応答を公開しないよう、無効のまま維持する"
get_community_name_masked: "****"
trap_community_name_masked: "****"
trap_hosts:
  - slot: "Host 1"
    ip_address: "10.0.30.15"
    description: "Zabbixサーバ(Trap受信・ポーリング元)"
  - slot: "Host 2"
    ip_address: "10.0.30.20"
    description: "NOC集約サーバ(バックアップTrap受信先)"
snmpv3_user_name: "zbx-poller"
snmpv3_security_level: "Authentication and Privacy"
snmpv3_auth_method: "SHA1"
snmpv3_auth_key_masked: "****"
snmpv3_privacy_encryption: "AES"
snmpv3_privacy_key_masked: "****"
mib_firmware_version: "7.1.1-7058"
zabbix_checks:
  - item_name: "CPU使用率"
    mib_source: "SonicWall独自MIB"
  - item_name: "メモリ使用率"
    mib_source: "SonicWall独自MIB"
  - item_name: "インターフェース状態(Up/Down)"
    mib_source: "MIB-II ifOperStatus"
  - item_name: "インターフェーストラフィック量"
    mib_source: "MIB-II ifInOctets / ifOutOctets"
verification_test_interface: "X3"
verification_test_interface_zone: "Unassigned"
