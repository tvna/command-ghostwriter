host: opa-01
bind_addr: 127.0.0.1
port: 8181
tls_cert_path: /etc/opa/tls/server.crt
tls_key_path: /etc/opa/tls/server.key
tls_ca_path: /etc/opa/tls/ca.crt
authentication_mode: token
authorization_enabled: true
management_token_path: /etc/opa/secrets/admin.token
bootstrap_token_path: /etc/opa/secrets/bootstrap.token
bundle_name: authz-policies
bundle_service: s3
bundle_resource: bundles/authz-policies/bundle.tar.gz
bundle_polling_min_seconds: 30
bundle_polling_max_seconds: 60
decision_logs_console: false
decision_logs_service: log-collector
health_endpoint: /health
health_bundle_check: true
metrics_bind_addr: 127.0.0.1
metrics_port: 8282
container_image: openpolicyagent/opa:0.68.0-static
container_name: opa-server
run_as_nonroot: true
run_as_uid: 1000
config_path: /etc/opa/config.yaml
policy_dir: /etc/opa/policies
systemd_service: opa-server
