service_name = "llm-inference-api"
namespace = "llm-inference"
job_label = "vllm-llm-inference-api"
prometheus_url = "http://prometheus.monitoring.svc:9090"
prometheus_config_path = "/etc/prometheus/prometheus.yml"
latency_metric_name = "vllm:e2e_request_latency_seconds"
ttft_metric_name = "vllm:time_to_first_token_seconds"
baseline_window = "1h"
slo_target_p95_seconds = 2.0
slo_window = "30d"
recording_rule_name = "job:vllm_e2e_latency_p95:5m"
alert_group_name = "llm-latency-slo"
alert_name = "LLMInferenceLatencySLOViolation"
alert_for_duration = "10m"
alert_severity = "warning"
alert_rules_path = "/etc/prometheus/rules/llm-latency-slo.yaml"
promtool_test_file_path = "/etc/prometheus/rules/tests/llm-latency-slo_test.yaml"
alertmanager_config_path = "/etc/alertmanager/alertmanager.yml"
alertmanager_url = "http://alertmanager.monitoring.svc:9093"
receiver_name = "llm-latency-slack"
slack_channel = "#llm-platform-alerts"
slack_webhook_secret_file = "/etc/alertmanager/secrets/slack-webhook-url"
test_alert_name = "TestLLMLatencyAlert"
