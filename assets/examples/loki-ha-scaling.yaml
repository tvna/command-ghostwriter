title: Loki 分散構成(simple scalable)構築演習
cluster_name: loki-prod
deployment_mode: simple-scalable
targets:
  - name: read
    replicas: 2
    http_port: 3101
    grpc_port: 9101
  - name: write
    replicas: 3
    http_port: 3102
    grpc_port: 9102
  - name: backend
    replicas: 3
    http_port: 3103
    grpc_port: 9103
object_store:
  type: s3
  endpoint: minio.internal.example.com:9000
  bucket: loki-chunks
  region: us-east-1
  access_key_env: LOKI_S3_ACCESS_KEY_ID
  secret_key_env: LOKI_S3_SECRET_ACCESS_KEY
  access_key_ref: "${LOKI_S3_ACCESS_KEY_ID}"
  secret_key_ref: "${LOKI_S3_SECRET_ACCESS_KEY}"
replication_factor: 3
memberlist_join:
  - loki-backend-0.loki-headless.loki.svc.cluster.local:7946
  - loki-backend-1.loki-headless.loki.svc.cluster.local:7946
  - loki-backend-2.loki-headless.loki.svc.cluster.local:7946
config_path: /etc/loki/config.yaml
