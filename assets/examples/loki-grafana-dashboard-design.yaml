datasource_uid: "loki-prod-01"
panels:
  - title: "ログ量推移"
    logql: "sum by(level) (count_over_time({job=\"app\"}[5m]))"
    type: "metrics"
  - title: "エラー率"
    logql: "sum(rate({job=\"app\"} |= \"level=error\" [5m])) / sum(rate({job=\"app\"}[5m]))"
    type: "metrics"
  - title: "上位ログソース"
    logql: "topk(10, sum by(source) (count_over_time({job=\"app\"}[5m])))"
    type: "metrics"
  - title: "生ログ表示"
    logql: "{job=\"app\", level=~\"$level\"}"
    type: "logs"
dashboard_variables:
  - name: "level"
    label_values_query: "label_values({job=\"app\"}, level)"
  - name: "source"
    label_values_query: "label_values({job=\"app\"}, source)"
time_range: "now-6h"
