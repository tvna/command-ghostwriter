service_name = "llm-inference-api"
job_label = "vllm-llm-inference-api"
prometheus_url = "http://prometheus.monitoring.svc:9090"
http_requests_metric_name = "http_requests_total"
baseline_window = "15m"
spike_window = "1h"
spike_lookback = "1 hour ago"
error_rate_threshold_percent = 5
rate_limit_status_code = "429"
oom_error_pattern = "CUDA out of memory"
model_load_error_pattern = "failed to load model"
upstream_timeout_pattern = "upstream request timeout"
recent_deploy_log_path = "/var/log/deploy/llm-inference-api-releases.log"
rate_limit_config_path = "/etc/llm-inference-api/rate-limit.yaml"
current_rate_limit_rps = 50
increased_rate_limit_rps = 80
model_cache_path = "/data/huggingface/hub"
api_port = 8000
restart_wait_seconds = 10
incident_log_path = "/var/log/llm-inference-api/error-triage.log"
