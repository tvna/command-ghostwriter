retention_days: 90
security_sources:
  - name: "auth_log"
    label: "認証ログ (auth.log)"
    job_name: "security_auth"
    path: "/var/log/auth.log"
    format: "syslog"
  - name: "audit_log"
    label: "監査ログ (auditd)"
    job_name: "security_audit"
    path: "/var/log/audit/audit.log"
    format: "audit"
  - name: "suricata_eve"
    label: "Suricata eve.json (IDS/IPS)"
    job_name: "security_suricata"
    path: "/var/log/suricata/eve.json"
    format: "json"
  - name: "opnsense_filterlog"
    label: "OPNsenseフィルタログ (FW)"
    job_name: "security_opnsense"
    path: "/var/log/opnsense/filter.log"
    format: "csv"
parse_stages:
  - job_name: "security_auth"
    stage_type: "regex"
    description: "sshd/sudoの認証失敗行からプロセス名と送信元IPをラベル抽出"
    regex: '^(?P<ts>\S+ \S+ \S+) \S+ (?P<process>sshd|sudo)\[\d+\]: (?P<message>.*Failed password.*from (?P<src_ip>[0-9.]+).*)'
  - job_name: "security_audit"
    stage_type: "regex"
    description: "auditdのtype=USER_AUTHレコードからresult(success/failed)を抽出"
    regex: 'type=(?P<audit_type>\S+).*res=(?P<result>success|failed)'
  - job_name: "security_suricata"
    stage_type: "json"
    description: "eve.jsonのalertイベントからevent_type/src_ip/dest_ipをラベル抽出"
    regex: ""
  - job_name: "security_opnsense"
    stage_type: "regex"
    description: "filterlog(CSV形式)からaction(pass/block)とsrc/dstを抽出"
    regex: '^\S+,\S+,\S+,\S+,(?P<action>pass|block),.*,(?P<src_ip>[0-9.]+),(?P<dst_ip>[0-9.]+),'
dashboards:
  - title: "認証失敗の相関ビュー"
    panel_type: "time_series"
    job_name: "security_auth"
    job_pattern: ""
    match_text: "Failed password"
    window: "5m"
    description: "5分間隔で送信元IPごとの認証失敗回数を集計し、ブルートフォース傾向を確認する"
  - title: "IPソース横断追跡"
    panel_type: "table"
    job_name: ""
    job_pattern: "security_auth|security_suricata|security_opnsense"
    match_text: "203.0.113.10"
    window: ""
    description: "特定の送信元IPを認証・IDS・FWの3系統ログで横断検索し、侵入経路を追跡する"
  - title: "IDSアラート発生数"
    panel_type: "time_series"
    job_name: "security_suricata"
    job_pattern: ""
    match_text: "alert"
    window: "15m"
    description: "Suricataシグネチャ別のアラート発生数を15分間隔で表示する"
