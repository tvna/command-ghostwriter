config_path = "/etc/loki/config.yaml"
loki_service = "loki"

current_ingestion_rate_mb = 4
current_ingestion_burst_size_mb = 6
current_per_stream_rate_limit = "3MB"
current_max_streams_per_user = 10000
current_max_line_size = 256000

new_ingestion_rate_mb = 16
new_ingestion_burst_size_mb = 32
new_per_stream_rate_limit = "10MB"
new_max_streams_per_user = 50000
new_max_line_size = 512000

high_cardinality_labels = "pod, container_id, request_id"
rate_limited_reason = "rate_limited"
ingester_streams_query = "sum(loki_ingester_memory_streams) by (tenant)"

[per_tenant_overrides.tenant-billing]
ingestion_rate_mb = 32
ingestion_burst_size_mb = 64
max_streams_per_user = 100000

[per_tenant_overrides.tenant-analytics]
ingestion_rate_mb = 8
ingestion_burst_size_mb = 16
max_streams_per_user = 20000
