title: ネットワーク機器syslogのWazuhエージェントレス収集
manager_ip: 192.0.2.10
syslog_port: 514
allowed_ips:
  - address: 192.0.2.1
    label: コアスイッチ (Catalyst 9300)
  - address: 192.0.2.2
    label: 境界ファイアウォール (FortiGate 100F)
  - address: 192.0.2.3
    label: L3スイッチ (YAMAHA RTX830)
device_types:
  - name: cisco_ios
    vendor: Cisco IOS
    sample_message: "%SEC-6-IPACCESSLOGP: list 101 denied tcp 203.0.113.5(0) -> 192.0.2.10(22), 1 packet"
  - name: fortigate
    vendor: FortiGate FortiOS
    sample_message: 'date=2026-07-18 time=10:15:00 devname=FGT100F devid=FG100F1234567890 logid=0000000013 type=traffic subtype=forward level=notice action=deny srcip=203.0.113.5 dstip=192.0.2.10 dstport=22 proto=6'
  - name: yamaha_rtx
    vendor: YAMAHA RTX830
    sample_message: "2026/07/18 10:15:00: [IP] Filter(101) denied 203.0.113.5[0] > 192.0.2.10[22]"
target_rules:
  - id: "100010"
    level: 10
    match: denied
    description: 未許可ポートへの外部アクセス拒否ログを検知
  - id: "100011"
    level: 12
    match: frequency
    description: 短時間に拒否ログが多発しポートスキャンの疑いを検知
  - id: "100012"
    level: 7
    match: configuration changed
    description: ネットワーク機器の設定変更ログを検知
test_source_ip: 192.0.2.1
attacker_ip: 203.0.113.5
