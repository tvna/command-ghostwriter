change_ticket: "CHG-2026-0731-06"
approver: "ネットワークセキュリティ責任者 鈴木"
observation_period: "48時間"
rollback_trigger: "対象ゾーン間で新規の到達不能または応答遅延の申告が2件以上、またはDEVICE | Investigate | Logsで意図しないAllow/Denyが1件でも確認された場合"
target_rules:
  - rule_name: "chg-app-db-https-allow"
    description: "staged: allow app tier to db tier HTTPS API calls"
    from_zone: "AppTier"
    to_zone: "DBTier"
    source_addr: "app-tier-net"
    dest_addr: "db-primary-host"
    service: "HTTPS"
    action: "Allow"
    priority: "Insert at the End"
  - rule_name: "chg-app-db-rdp-deny"
    description: "staged: explicit deny app tier to db tier RDP (visibility only)"
    from_zone: "AppTier"
    to_zone: "DBTier"
    source_addr: "app-tier-net"
    dest_addr: "db-primary-host"
    service: "RDP"
    action: "Deny"
    priority: "Insert at the End"
