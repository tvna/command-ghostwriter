aws_region = "ap-northeast-1"
instance_type = "g5.2xlarge"
ami_id = "ami-0abcdef1234567890"
availability_zone = "ap-northeast-1a"
max_spot_price = "0.90"
key_name = "gpu-training-key"
security_group_id = "sg-0123456789abcdef0"
subnet_id = "subnet-0123456789abcdef0"
iam_instance_profile = "gpu-training-role"
checkpoint_bucket = "ml-training-checkpoints"
checkpoint_prefix = "runs/exp-001"
checkpoint_interval_min = 15
training_script = "train.py"
training_workdir = "/opt/training"
log_file = "/var/log/gpu-training/train.log"
interruption_poll_sec = 5
lookback_days = 7
