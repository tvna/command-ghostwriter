baseline_template_name: "baseline-branch-fw-v3"
baseline_version_label: "v3(2026-06-01 承認)"
baseline_owner: "情報システム部 ネットワークグループ"
target_group_name: "branch-firewalls-jp"
target_firewalls:
  - name: "fw-osaka-01"
    site: "大阪支店"
    role: "支店エッジファイアウォール"
  - name: "fw-nagoya-01"
    site: "名古屋支店"
    role: "支店エッジファイアウォール"
  - name: "fw-sendai-01"
    site: "仙台支店"
    role: "支店エッジファイアウォール"
audit_categories:
  - category: "Access Rules"
    reason: "本社・支店間およびインターネット向け通信を制御する最重要設定であり、意図しない許可ルールの追加を早期に検知する必要があるため"
  - category: "NAT Policies"
    reason: "外部公開サービス向けの穴あけ設定が無断で変更されていないかを確認するため"
  - category: "VPN Policies"
    reason: "拠点間VPNのトンネル設定が改変されていないかを確認するため"
  - category: "Log and Reporting Settings"
    reason: "ログ転送先やレポート設定は現場の運用調整で変更されることがあり、内容を確認したうえで許容可否を判断する必要があるため"
posture_score_threshold: 85
drift_response_policy:
  - category: "Access Rules"
    recommended_action: "Remediate"
    reason: "承認済み変更管理プロセスを経ない逸脱は原則として許可しないため、firewall側の設定をテンプレートの内容に戻す"
  - category: "NAT Policies"
    recommended_action: "Remediate"
    reason: "外部公開設定の無断変更は重大インシデントにつながるおそれがあるため、firewall側の設定をテンプレートの内容に戻す"
  - category: "VPN Policies"
    recommended_action: "Remediate"
    reason: "拠点間通信の可用性・機密性に直結するため、firewall側の設定をテンプレートの内容に戻す"
  - category: "Log and Reporting Settings"
    recommended_action: "Accept"
    reason: "軽微な運用調整であることを確認できた場合は、変更内容をテンプレート側に反映して承認する"
verification_target_firewall: "fw-osaka-01"
verification_change_description: "SonicOS側で直接、コメントに「drift-test」を含む一時的な許可ルールをAccess Rulesに追加する"
notification_recipients:
  - "netops-alerts@example.com"
  - "branch-fw-owner@example.com"
