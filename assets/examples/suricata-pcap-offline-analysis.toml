[analysis]
pcap_path = "/evidence/case-2026-0417/capture_full.pcap"
output_dir = "/tmp/analysis/case-2026-0417"
ruleset_snapshot = "/etc/suricata/rules/snapshot-2026-04-17"
checksum_verify = true

[suricata]
config_path = "/etc/suricata/suricata.yaml"
