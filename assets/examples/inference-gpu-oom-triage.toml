service_name = "vllm-llama3-70b"
model_id = "meta-llama/Meta-Llama-3.1-70B-Instruct"
gpu_device_id = 0
oom_error_pattern = "CUDA out of memory"
current_max_model_len = 16384
current_max_num_seqs = 64
current_gpu_memory_utilization = 0.95
reduced_max_model_len = 8192
reduced_max_num_seqs = 16
