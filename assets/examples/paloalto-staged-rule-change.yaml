change_ticket: "CHG-2026-0731-04"
approver: "ネットワークセキュリティ責任者 佐藤"
observation_period: "48時間"
rollback_trigger: "対象セグメントで新規の到達不能または応答遅延の申告が2件以上、またはRule Usageで想定していない送信元からのHit Count増加が1件でも確認された場合"
baseline_snapshot_name: "chg-2026-0731-04-baseline"
target_rules:
  - rule_name: "stg-app-payment-gw-https"
    from_zone: "app-tier"
    to_zone: "payment-gw"
    source: "app-tier-net"
    destination: "payment-gw-host"
    application: "ssl"
    service: "application-default"
    action: "allow"
    description: "アプリ層から決済ゲートウェイへのHTTPS(App-ID: ssl)のみを許可する新規ルール"
  - rule_name: "stg-app-legacy-telnet-deny"
    from_zone: "app-tier"
    to_zone: "payment-gw"
    source: "app-tier-net"
    destination: "payment-gw-host"
    application: "telnet"
    service: "application-default"
    action: "deny"
    description: "廃止予定の平文Telnet経路を明示的に拒否し、既定のinterzone-defaultより先に遮断ログを残す"
