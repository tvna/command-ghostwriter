vault_addr: https://vault.internal.example.com:8200
auth_method: approle
role_id_path: /etc/vault-agent/role_id
secret_id_path: /etc/vault-agent/secret_id
agent_config_path: /etc/vault-agent/agent.hcl
pid_file: /run/vault-agent/pidfile
run_as: appuser
app_service: myapp.service
kv_secret_path: secret/data/myapp/db
templates:
  - source: /etc/vault-agent/templates/db-config.ctmpl
    destination: /etc/myapp/secrets/db-config.env
  - source: /etc/vault-agent/templates/api-key.ctmpl
    destination: /etc/myapp/secrets/api-key.env
