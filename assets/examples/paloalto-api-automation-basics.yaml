firewall_host: "https://fw-edge1.example.internal"
pan_os_version: "v11.1"
vsys_name: "vsys1"
admin_role_name: "svc-rule-automation-role"
service_admin_user: "svc-rule-automation"
api_key_lifetime_minutes: 4320

rules:
  - rule_name: "svc-automation-outbound-partner-api"
    from_zone: "trust"
    to_zone: "untrust"
    source: "10.0.40.0/24"
    destination: "any"
    application: "ssl"
    service: "application-default"
    action: "allow"
    description: "automation controller to external partner API"
  - rule_name: "svc-automation-cmdb-sync"
    from_zone: "trust"
    to_zone: "dmz"
    source: "10.0.40.0/24"
    destination: "10.0.60.30/32"
    application: "https"
    service: "application-default"
    action: "allow"
    description: "inventory sync to CMDB"
