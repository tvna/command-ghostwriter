#
# Dependabot Updates
#
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/ja/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# NOTE: `security-updates` は dependabot.yml の有効キーではないため使用しない
# (セキュリティ更新はリポジトリ設定側で有効化する)。Refs #367.
---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: daily
      time: "18:00"
      timezone: "Asia/Tokyo"
    target-branch: develop

  # NOTE: JavaScriptパッケージ管理をnpmからbunへ移行(#353)したため、`npm`エコシステムの
  # 対象ファイル(package-lock.json)は存在しない。`package-ecosystem: bun`は
  # Dependabotがサポートしない値でスキーマ検証に失敗するため使用できない(#367で確認済み)。
  # bunがサポートされるまでJS依存のDependabot自動更新は一時停止し、`bun update`を手動/別途の
  # 仕組みで運用する。

  - package-ecosystem: pip
    directory: /
    groups:
      pip:
        patterns:
          - "*"
    schedule:
      interval: daily
      time: "20:00"
      timezone: "Asia/Tokyo"
    target-branch: develop

  - package-ecosystem: devcontainers
    directory: /
    groups:
      devcontainers:
        patterns:
          - "*"
    schedule:
      interval: daily
      time: "21:00"
      timezone: "Asia/Tokyo"
    target-branch: develop
